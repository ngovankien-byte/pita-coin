<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pita Coins - Nạp Xu TikTok Tiết Kiệm</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- React & ReactDOM -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        [v-cloak] { display: none; }
    </style>
</head>
<body class="bg-[#f8f8f8]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // Firebase Configuration (From project context)
        const firebaseConfig = {
            projectId: "gen-lang-client-0194923047",
            appId: "1:296381438869:web:f0ec0a448f872db21bb49c",
            apiKey: "AIzaSyC0Q0JyyXIn_ds7hsyBq9kVIVNBxyh5FGo",
            authDomain: "gen-lang-client-01949230-5a9d0.firebaseapp.com",
            storageBucket: "gen-lang-client-0194923047.firebasestorage.app",
            messagingSenderId: "296381438869",
            firestoreDatabaseId: "ai-studio-cf519855-4d00-4962-a87e-d785ad57a9d9"
        };

        // Bank Configuration
        const BANK_CONFIG = {
            bankId: "vcb",
            accountNumber: "0411001086628",
            accountName: "NGO VAN KIEN",
            zaloNumber: "0358247870",
            zaloLink: "https://zalo.me/0358247870",
        };

        const COIN_PACKAGES = [
            { coins: 30, price: 8550 },
            { coins: 350, price: 99750 },
            { coins: 700, price: 199500 },
            { coins: 1400, price: 399000 },
            { coins: 3500, price: 997500 },
            { coins: 7000, price: 1995000 },
            { coins: 17500, price: 4987500 },
        ];

        function App() {
            const [tiktokId, setTiktokId] = useState(localStorage.getItem('pita_tiktok_id') || "");
            const [balance, setBalance] = useState(0);
            const [selectedPackage, setSelectedPackage] = useState(null);
            const [isCustom, setIsCustom] = useState(false);
            const [customCoins, setCustomCoins] = useState("");
            const [showConfirm, setShowConfirm] = useState(false);
            const [showPayment, setShowPayment] = useState(false);
            const [showZalo, setShowZalo] = useState(false);
            const [isLoginModalOpen, setIsLoginModalOpen] = useState(!tiktokId);
            const [loginInput, setLoginInput] = useState(tiktokId);
            const [countdown, setCountdown] = useState(300);

            useEffect(() => {
                let timer;
                if (showPayment && countdown > 0) {
                    timer = setInterval(() => setCountdown(c => c - 1), 1000);
                } else if (countdown === 0) {
                    setShowPayment(false);
                    setCountdown(300);
                }
                return () => clearInterval(timer);
            }, [showPayment, countdown]);

            const formatPrice = (p) => "đ" + new Intl.NumberFormat("vi-VN").format(p);
            const formatTime = (s) => `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
            
            const getRate = (c) => {
                if (c <= 20000) return 285;
                if (c <= 50000) return 284;
                return 280;
            };

            const handleLogin = () => {
                if (loginInput.trim()) {
                    setTiktokId(loginInput);
                    localStorage.setItem('pita_tiktok_id', loginInput);
                    setIsLoginModalOpen(false);
                }
            };

            const handleRecharge = () => {
                if (!tiktokId) { setIsLoginModalOpen(true); return; }
                setShowConfirm(true);
            };

            const confirmRecharge = () => {
                setShowConfirm(false);
                setShowPayment(true);
            };

            const finalCoins = isCustom ? parseInt(customCoins) || 0 : selectedPackage?.coins || 0;
            const finalPrice = isCustom ? finalCoins * getRate(finalCoins) : selectedPackage?.price || 0;

            return (
                <div className="min-h-screen transition-all duration-500">
                    {/* Header */}
                    <header className="h-[60px] bg-white border-b border-gray-100 flex items-center justify-between px-4 md:px-10 sticky top-0 z-40">
                        <div className="flex items-center gap-2">
                            <div className="bg-black p-1.5 rounded-lg">
                                <i data-lucide="coins" class="text-white w-5 h-5"></i>
                            </div>
                            <span className="font-black text-xl tracking-tighter text-[#161823]">Pita/Coins</span>
                        </div>
                        {tiktokId ? (
                             <div 
                                onClick={() => setIsLoginModalOpen(true)}
                                class="flex items-center gap-3 bg-gray-50 px-3 py-1.5 rounded-full cursor-pointer hover:bg-gray-100 transition-colors"
                             >
                                <div class="w-7 h-7 bg-[#fe2c55] rounded-full flex items-center justify-center">
                                    <i data-lucide="user" class="text-white w-4 h-4"></i>
                                </div>
                                <span class="text-sm font-bold truncate max-w-[100px]">{tiktokId}</span>
                             </div>
                        ) : (
                            <button onClick={() => setIsLoginModalOpen(true)} class="bg-[#fe2c55] text-white px-5 py-2 rounded-md font-bold text-sm">Log in</button>
                        )}
                    </header>

                    <main className="max-w-4xl mx-auto p-4 md:p-10">
                        <section className="bg-white rounded-2xl shadow-sm p-6 md:p-10 border border-gray-50">
                            <h1 className="text-2xl md:text-3xl font-black mb-8">Get Coins</h1>
                            
                            {/* User Info */}
                            <div className="bg-[#f1f1f2] rounded-xl p-4 flex items-center justify-between mb-8">
                                <div className="flex items-center gap-4">
                                    <div className="w-12 h-12 bg-gray-200 rounded-full flex items-center justify-center">
                                        <i data-lucide="user" class="text-gray-400 w-6 h-6"></i>
                                    </div>
                                    <div>
                                        <p className="font-black text-lg">{tiktokId || "GUEST MODE"}</p>
                                        <p className="text-xs text-[#face15] font-bold tracking-wider uppercase">Balance: {balance} coins</p>
                                    </div>
                                </div>
                                <button className="text-[#fe2c55] font-bold text-sm hover:underline" onClick={() => setIsLoginModalOpen(true)}>
                                    {tiktokId ? "Switch ID" : "Set ID"}
                                </button>
                            </div>

                            <p className="text-xs font-bold mb-6 flex items-center gap-2">
                                <span className="text-[#fe2c55]">Tiết kiệm lên tới 25% với tỷ giá nạp xu từ dịch vụ bên thứ ba.</span>
                                <i data-lucide="info" class="w-3.5 h-3.5 text-gray-400"></i>
                            </p>

                            {/* Packages */}
                            <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3 mb-10">
                                {COIN_PACKAGES.map((pkg, i) => (
                                    <button 
                                        key={i}
                                        onClick={() => { setSelectedPackage(pkg); setIsCustom(false); }}
                                        className={`p-4 rounded-xl text-center border-2 transition-all ${selectedPackage?.coins === pkg.coins && !isCustom ? 'border-[#fe2c55] bg-white shadow-lg' : 'border-transparent bg-[#f1f1f2] hover:bg-gray-200'}`}
                                    >
                                        <div className="flex items-center justify-center gap-1.5 mb-1">
                                            <div className="w-5 h-5 bg-[#face15] rounded-full flex items-center justify-center">
                                                <span className="text-[10px] font-bold text-white">d</span>
                                            </div>
                                            <span className="font-black text-xl">{pkg.coins.toLocaleString()}</span>
                                        </div>
                                        <span className="text-gray-400 text-sm font-medium underline underline-offset-4">{formatPrice(pkg.price)}</span>
                                    </button>
                                ))}
                                <div 
                                    onClick={() => { setIsCustom(true); setSelectedPackage(null); }}
                                    className={`p-4 rounded-xl text-center border-2 transition-all cursor-pointer ${isCustom ? 'border-[#fe2c55] bg-white shadow-lg' : 'border-transparent bg-[#f1f1f2] hover:bg-gray-200'}`}
                                >
                                    {isCustom ? (
                                        <input 
                                            type="number" 
                                            value={customCoins} 
                                            onChange={(e) => setCustomCoins(e.target.value)}
                                            placeholder="Xu"
                                            className="w-full bg-transparent border-b-2 border-[#fe2c55] focus:outline-none text-center font-black text-lg appearance-none"
                                        />
                                    ) : (
                                        <span className="font-black text-lg text-gray-400">Custom</span>
                                    )}
                                </div>
                            </div>

                            {/* Recharge Button */}
                            <div className="flex flex-col sm:flex-row items-center justify-between gap-6 pt-6 border-t border-gray-100">
                                <div className="text-center sm:text-left">
                                    <p className="text-gray-400 text-xs font-black uppercase tracking-widest mb-1">Tổng tiền</p>
                                    <p className="text-3xl font-black text-[#fe2c55]">{formatPrice(finalPrice)}</p>
                                </div>
                                <button 
                                    disabled={!finalCoins || finalCoins < 30}
                                    onClick={handleRecharge}
                                    className="w-full sm:w-64 py-4 bg-[#fe2c55] text-white rounded-xl font-black text-lg disabled:opacity-30 shadow-xl shadow-pink-100 hover:scale-[1.02] active:scale-[0.98] transition-all"
                                >
                                    Nạp Ngay
                                </button>
                            </div>
                        </section>
                    </main>

                    {/* Modals */}
                    {isLoginModalOpen && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setIsLoginModalOpen(false)}></div>
                            <div className="relative bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl">
                                <h3 className="text-2xl font-black mb-6 text-center">TikTok Login</h3>
                                <input 
                                    type="text" 
                                    value={loginInput} 
                                    onChange={(e) => setLoginInput(e.target.value)}
                                    placeholder="@username"
                                    className="w-full p-4 bg-gray-50 rounded-2xl border-2 border-transparent focus:border-[#fe2c55] mb-4 font-bold transition-all outline-none"
                                />
                                <button 
                                    onClick={handleLogin}
                                    className="w-full py-4 bg-[#fe2c55] text-white rounded-2xl font-black text-lg"
                                >
                                    Đăng Nhập
                                </button>
                            </div>
                        </div>
                    )}

                    {showConfirm && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowConfirm(false)}></div>
                            <div className="relative bg-white w-full max-w-md rounded-3xl p-8 shadow-2xl">
                                <h3 className="text-2xl font-black mb-6">Xác nhận</h3>
                                <div className="bg-gray-50 p-6 rounded-2xl space-y-4 mb-8">
                                    <div className="flex justify-between font-bold"><span class="text-gray-400">Account:</span><span>{tiktokId}</span></div>
                                    <div className="flex justify-between font-bold"><span class="text-gray-400">Coins:</span><span class="text-[#face15]">{finalCoins.toLocaleString()} xu</span></div>
                                    <div className="flex justify-between font-black text-xl border-t pt-4"><span class="text-gray-400">Price:</span><span class="text-[#fe2c55]">{formatPrice(finalPrice)}</span></div>
                                </div>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowConfirm(false)} class="flex-1 py-4 font-bold border-2 rounded-2xl">Hủy</button>
                                    <button onClick={confirmRecharge} class="flex-1 py-4 font-black bg-[#fe2c55] text-white rounded-2xl">Nạp</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showPayment && !showZalo && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowPayment(false)}></div>
                            <div className="relative bg-white w-full max-w-lg rounded-3xl p-8 shadow-2xl flex flex-col max-h-[90vh]">
                                <div className="flex justify-between items-center mb-6">
                                    <h3 className="text-2xl font-black">Thanh toán</h3>
                                    <button onClick={() => setShowPayment(false)}><i data-lucide="x" class="w-6 h-6"></i></button>
                                </div>
                                <div class="overflow-y-auto scrollbar-hide text-center">
                                    <div class="mb-6 flex justify-center gap-4 bg-gray-50 p-4 rounded-xl font-black text-sm">
                                        <div class="text-[#face15]">{finalCoins.toLocaleString()} Xu</div>
                                        <div class="text-gray-300">|</div>
                                        <div class="text-[#fe2c55]">{formatPrice(finalPrice)}</div>
                                    </div>
                                    
                                    <div class="flex flex-col items-center gap-3 mb-6">
                                        <div class="bg-red-50 text-[#fe2c55] px-4 py-1 rounded-full text-sm font-black flex items-center gap-2">
                                            <i data-lucide="clock" class="w-4 h-4"></i>
                                            {formatTime(countdown)}
                                        </div>
                                        <div class="p-3 border-2 border-gray-100 rounded-3xl inline-block bg-white shadow-inner">
                                            <img 
                                                src={`https://img.vietqr.io/image/${BANK_CONFIG.bankId}-${BANK_CONFIG.accountNumber}-compact2.png?amount=${finalPrice}&addInfo=NAP%20XU%20${tiktokId}&accountName=PitaCoins`}
                                                class="w-56 h-56 object-contain"
                                            />
                                        </div>
                                        <p class="text-[10px] font-black text-gray-400 uppercase tracking-widest mt-2">Nội dung: NAP XU {tiktokId}</p>
                                    </div>

                                    <div class="p-4 bg-yellow-50 text-yellow-800 text-xs font-bold rounded-xl mb-6">
                                        Sau khi chuyển khoản qua VietQR, vui lòng bấm nút dưới đây để thông báo cho hệ thống.
                                    </div>

                                    <button 
                                        onClick={() => setShowZalo(true)}
                                        class="w-full py-4 bg-[#fe2c55] text-white rounded-2xl font-black text-xl shadow-xl shadow-pink-100"
                                    >
                                        Đã chuyển khoản
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {showZalo && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center px-4">
                            <div className="absolute inset-0 bg-black/60 backdrop-blur-sm" onClick={() => setShowZalo(false)}></div>
                            <div className="relative bg-white w-full max-w-sm rounded-3xl p-8 shadow-2xl text-center">
                                <div class="w-20 h-20 bg-blue-50 text-blue-500 rounded-full flex items-center justify-center mx-auto mb-6">
                                    <i data-lucide="message-circle" class="w-10 h-10"></i>
                                </div>
                                <h3 class="text-2xl font-black mb-2">Liên hệ duyệt xu</h3>
                                <p class="text-gray-500 mb-6 text-sm">Gửi ảnh màn hình chuyển khoản qua Zalo số <b>{BANK_CONFIG.zaloNumber}</b> để được duyệt xu ngay!</p>
                                <div class="bg-white p-3 border-2 border-blue-50 rounded-2xl mb-8 inline-block">
                                    <img src={`https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(BANK_CONFIG.zaloLink)}`} class="w-40 h-40" />
                                </div>
                                <div class="space-y-3">
                                    <a href={BANK_CONFIG.zaloLink} target="_blank" class="block w-full py-4 bg-blue-500 text-white rounded-2xl font-black flex items-center justify-center gap-2">
                                        <i data-lucide="smartphone" class="w-5 h-5"></i>
                                        Mở Zalo Ngay
                                    </a>
                                    <button onClick={() => setShowZalo(false)} class="w-full py-4 text-gray-400 font-bold">Đóng</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Floating Zalo */}
                    <a href={BANK_CONFIG.zaloLink} target="_blank" class="fixed bottom-6 right-6 bg-blue-500 text-white p-4 rounded-full shadow-2xl z-40 hover:scale-110 transition-all flex items-center justify-center group">
                         <div class="absolute right-full mr-3 bg-white text-blue-500 px-3 py-1.5 rounded-lg text-xs font-bold shadow-lg opacity-0 group-hover:opacity-100 transition-opacity whitespace-nowrap">Hỗ trợ Zalo 24/7</div>
                         <i data-lucide="message-circle" class="w-6 h-6 md:w-7 md:h-7"></i>
                    </a>
                </div>
            );
        }

        // Initialize Lucide Icons after component render
        function Initializer() {
            useEffect(() => { lucide.createIcons(); });
            return null;
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<React.Fragment><App /><Initializer /></React.Fragment>);

    </script>
</body>
</html>
