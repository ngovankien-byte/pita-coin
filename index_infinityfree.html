<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pita Coins - Nạp Xu TikTok Chiết Khấu Cao</title>
    
    <!-- Scripts & Frameworks -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    
    <!-- Firebase SDK (v9+ Compatibility) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        input::-webkit-outer-spin-button, input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
        .glow-button { box-shadow: 0 0 20px rgba(254, 44, 85, 0.3); }
    </style>
</head>
<body class="bg-[#f8f8f8] text-[#161823]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { motion, AnimatePresence } = FramerMotion;

        // --- CẤU HÌNH HỆ THỐNG ---
        const firebaseConfig = {
            projectId: "gen-lang-client-0194923047",
            appId: "1:296381438869:web:f0ec0a448f872db21bb49c",
            apiKey: "AIzaSyC0Q0JyyXIn_ds7hsyBq9kVIVNBxyh5FGo",
            authDomain: "gen-lang-client-01949230-5a9d0.firebaseapp.com",
            storageBucket: "gen-lang-client-0194923047.firebasestorage.app",
            messagingSenderId: "296381438869",
            firestoreDatabaseId: "ai-studio-cf519855-4d00-4962-a87e-d785ad57a9d9"
        };

        const BANK_CONFIG = {
            bankId: "vcb", // Vietcombank
            accountNumber: "0411001086628",
            accountName: "NGO VAN KIEN",
            zaloNumber: "0358247870",
            zaloLink: "https://zalo.me/0358247870",
        };

        const COIN_PACKAGES = [
            { coins: 30, price: 8550 },
            { coins: 350, price: 99750 },
            { coins: 700, price: 199500 },
            { coins: 1400, price: 399000 },
            { coins: 3500, price: 997500 },
            { coins: 7000, price: 1995000 },
            { coins: 17500, price: 4987500 },
            { coins: 35000, price: 9975000 },
        ];

        // Khởi tạo Firebase
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        function App() {
            const [tiktokId, setTiktokId] = useState(localStorage.getItem('pita_tiktok_id') || "");
            const [selectedPackage, setSelectedPackage] = useState(null);
            const [isCustom, setIsCustom] = useState(false);
            const [customCoins, setCustomCoins] = useState("");
            const [showPayment, setShowPayment] = useState(false);
            const [showLogin, setShowLogin] = useState(!tiktokId);
            const [countdown, setCountdown] = useState(1800); // 30 phút
            const [copied, setCopied] = useState(false);

            useEffect(() => {
                lucide.createIcons();
                if (showPayment && countdown > 0) {
                    const timer = setInterval(() => setCountdown(c => c - 1), 1000);
                    return () => clearInterval(timer);
                }
            }, [showPayment, countdown]);

            const formatVND = (v) => new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(v);
            
            const handleLogin = (id) => {
                if (id) {
                    setTiktokId(id);
                    localStorage.setItem('pita_tiktok_id', id);
                    setShowLogin(false);
                }
            };

            const handleLogout = () => {
                setTiktokId("");
                localStorage.removeItem('pita_tiktok_id');
                // Since this version doesn't track balance state, we just clear the ID
            };

            const getFinalPrice = () => {
                if (isCustom) {
                    const amount = parseInt(customCoins) || 0;
                    const rate = amount >= 50000 ? 280 : (amount >= 20000 ? 284 : 285);
                    return amount * rate;
                }
                return selectedPackage?.price || 0;
            };

            const getFinalCoins = () => isCustom ? (parseInt(customCoins) || 0) : (selectedPackage?.coins || 0);

            return (
                <div className="min-h-screen pb-20">
                    {/* Header */}
                    <nav className="h-[64px] bg-white border-b border-gray-100 sticky top-0 z-40 flex items-center justify-between px-6 md:px-12">
                        <div className="flex items-center gap-2">
                            <div className="bg-[#fe2c55] p-1.5 rounded-lg rotate-[-10deg] shadow-lg shadow-pink-200">
                                <i data-lucide="zap" class="text-white w-5 h-5 fill-white"></i>
                            </div>
                            <span className="font-black text-2xl tracking-tighter italic">PitaCoins</span>
                        </div>
                        {tiktokId ? (
                            <div onClick={() => setShowLogin(true)} class="flex items-center gap-3 bg-gray-50 px-4 py-2 rounded-full cursor-pointer hover:bg-gray-100 transition-all border border-gray-100">
                                <div class="w-7 h-7 bg-black text-white rounded-full flex items-center justify-center text-xs font-bold uppercase">{tiktokId.substring(0,1)}</div>
                                <span class="text-sm font-bold text-gray-700">{tiktokId}</span>
                                <i data-lucide="chevron-down" class="w-4 h-4 text-gray-400"></i>
                            </div>
                        ) : (
                            <button onClick={() => setShowLogin(true)} class="bg-[#fe2c55] text-white px-6 py-2 rounded-md font-bold text-sm hover:opacity-90 active:scale-95 transition-all">Đăng nhập</button>
                        )}
                    </nav>

                    <main className="max-w-4xl mx-auto mt-8 px-4">
                        <div className="bg-white rounded-[32px] p-8 md:p-12 shadow-xl shadow-gray-200/50 border border-gray-50">
                            <div className="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-12">
                                <div className="flex items-center gap-3">
                                    <img 
                                        src="logo.png" 
                                        alt="Pita Logo" 
                                        className="h-12 w-12 rounded-full shadow-lg border-2 border-white"
                                        onError={(e) => { e.target.src = "https://sf16-scmcdn-va.ibytedtos.com/goofy/tiktok/web/node/_next/static/images/logo-dark-e95da587b6de167aaed06c9da23175f3.svg" }}
                                    />
                                    <div>
                                        <h1 className="text-3xl md:text-4xl font-black text-[#161823] tracking-tighter leading-tight">Pita Coins</h1>
                                        <p className="text-[#fe2c55] font-black uppercase tracking-[0.2em] text-[10px] mt-0.5">Luxury Recharge Service</p>
                                    </div>
                                </div>
                                <div className="bg-blue-50 text-blue-600 px-4 py-2 rounded-2xl flex items-center gap-2 text-sm font-bold">
                                    <i data-lucide="shield-check" class="w-4 h-4"></i>
                                    Giao dịch an toàn
                                </div>
                            </div>

                            {/* User Display */}
                            <div className="bg-[#f8f8f8] rounded-3xl p-6 flex flex-col md:flex-row items-center justify-between gap-6 mb-12 border-2 border-white shadow-inner">
                                <div className="flex items-center gap-5">
                                    <div className="w-16 h-16 bg-white rounded-full flex items-center justify-center shadow-md border-4 border-white overflow-hidden">
                                        <img src={`https://api.dicebear.com/7.x/avataaars/svg?seed=${tiktokId || 'Guest'}`} class="w-full h-full object-cover" />
                                    </div>
                                    <div>
                                        <h2 className="text-xl font-black">{tiktokId || "Chưa đăng nhập"}</h2>
                                        <div className="flex items-center gap-2 text-gray-400 text-sm font-bold">
                                            <i data-lucide="coins" class="w-4 h-4 text-[#face15]"></i>
                                            Tài khoản: {tiktokId ? 'Hoạt động' : 'Chưa xác định'}
                                        </div>
                                    </div>
                                </div>
                                <div className="flex items-center gap-3">
                                    <button onClick={() => setShowLogin(true)} class="text-[#fe2c55] font-black text-sm hover:underline py-2 px-4 bg-white rounded-xl shadow-sm border border-gray-100">Thay đổi tài khoản</button>
                                    {tiktokId && (
                                        <button onClick={handleLogout} className="text-gray-400 font-bold text-xs hover:text-red-500 uppercase py-2">Đăng xuất</button>
                                    )}
                                </div>
                            </div>

                            <p className="text-sm font-bold text-gray-500 mb-8 flex items-center gap-2">
                                <i data-lucide="info" class="w-5 h-5 text-[#fe2c55]"></i>
                                Tiết kiệm lên tới 31% so với nạp trực tiếp qua kho ứng dụng.
                            </p>

                            {/* Packages Grid */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-12">
                                {COIN_PACKAGES.map((pkg, i) => (
                                    <button 
                                        key={i}
                                        onClick={() => { setSelectedPackage(pkg); setIsCustom(false); }}
                                        className={`relative p-6 rounded-[28px] border-2 transition-all group overflow-hidden ${selectedPackage?.coins === pkg.coins && !isCustom ? 'border-[#fe2c55] bg-white ring-8 ring-pink-50' : 'border-gray-100 bg-white hover:border-[#fe2c55] hover:bg-gray-50'}`}
                                    >
                                        <div className="flex items-center justify-center gap-2 mb-2">
                                            <div className="w-6 h-6 bg-[#face15] rounded-full flex items-center justify-center rotate-[-10deg]">
                                                <span className="text-[10px] font-black text-white">d</span>
                                            </div>
                                            <span className="text-2xl font-black">{pkg.coins.toLocaleString()}</span>
                                        </div>
                                        <div className="text-gray-400 font-bold text-xs uppercase tracking-tighter">{formatVND(pkg.price)}</div>
                                        {selectedPackage?.coins === pkg.coins && !isCustom && (
                                            <div className="absolute top-2 right-2 flex items-center justify-center bg-[#fe2c55] text-white w-6 h-6 rounded-full">
                                                <i data-lucide="check" class="w-3.5 h-3.5 stroke-[4]"></i>
                                            </div>
                                        )}
                                    </button>
                                ))}
                                <div 
                                    onClick={() => { setIsCustom(true); setSelectedPackage(null); }}
                                    className={`relative p-6 rounded-[28px] border-2 transition-all cursor-pointer group flex flex-col justify-center items-center min-h-[120px] ${isCustom ? 'border-[#fe2c55] bg-[#fff0f3]' : 'border-gray-100 bg-[#f8f8f8] hover:border-[#fe2c55] hover:bg-gray-50'}`}
                                >
                                    {!isCustom ? (
                                        <div className="text-center">
                                            <div className="flex items-center gap-2 mb-1 justify-center">
                                                <div className="w-6 h-6 bg-[#face15] rounded-full flex items-center justify-center border border-white shadow-sm">
                                                    <span className="text-[10px] font-black text-white">d</span>
                                                </div>
                                                <span className="font-black text-xl text-[#161823]">Tùy chỉnh</span>
                                            </div>
                                            <div className="text-[#8a8b91] font-bold text-xs">Hỗ trợ số lượng lớn</div>
                                        </div>
                                    ) : (
                                        <div className="w-full flex flex-col items-center">
                                            <div className="flex items-center gap-3 mb-2 justify-center w-full px-4">
                                                <div className="w-6 h-6 md:w-8 md:h-8 bg-[#face15] rounded-full flex items-center justify-center shrink-0 shadow-sm border border-white">
                                                    <span className="text-[10px] font-black text-white">d</span>
                                                </div>
                                                <div className="flex-1 max-w-[150px] border-b-2 border-black pb-1">
                                                    <input 
                                                        autoFocus
                                                        type="number" 
                                                        value={customCoins} 
                                                        onChange={(e) => setCustomCoins(e.target.value)}
                                                        className="w-full bg-transparent border-none text-center font-black text-2xl outline-none shadow-none appearance-none focus:ring-0 focus:outline-none"
                                                        placeholder=""
                                                    />
                                                </div>
                                            </div>
                                            <div className="text-[#fe2c55] text-xs font-black flex items-center gap-1.5 mt-1">
                                                <div className="w-4 h-4 bg-[#fe2c55] rounded-full flex items-center justify-center text-white text-[10px]">×</div>
                                                <span>Tối thiểu: 30</span>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>

                            {/* Summary & Action */}
                            <div className="flex flex-col md:flex-row items-center justify-between gap-8 pt-10 border-t border-gray-100">
                                <div className="text-center md:text-left">
                                    <span className="text-gray-400 font-black text-xs uppercase tracking-[0.2em] mb-2 block">Thanh toán dự kiến</span>
                                    <div className="flex items-baseline gap-2">
                                        <span className="text-5xl font-black text-[#fe2c55] tracking-tighter">{formatVND(getFinalPrice()).replace('₫','')}</span>
                                        <span className="text-lg font-black text-[#fe2c55]">VNĐ</span>
                                    </div>
                                </div>
                                <button 
                                    disabled={!tiktokId || getFinalCoins() < 30}
                                    onClick={() => setShowPayment(true)}
                                    className="w-full md:w-[320px] py-6 bg-[#fe2c55] text-white rounded-[24px] font-black text-xl shadow-2xl shadow-pink-200 active:scale-95 disabled:opacity-30 disabled:pointer-events-none hover:shadow-pink-300 hover:scale-[1.02] transition-all flex items-center justify-center gap-3 glow-button"
                                >
                                    <span>Tiếp tục thanh toán</span>
                                    <i data-lucide="arrow-right" class="w-6 h-6 stroke-[3]"></i>
                                </button>
                            </div>
                        </div>
                    </main>

                    {/* Login Modal */}
                    <AnimatePresence>
                        {showLogin && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                                <motion.div 
                                    initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                    className="absolute inset-0 bg-black/70 backdrop-blur-md" 
                                    onClick={() => tiktokId && setShowLogin(false)}
                                />
                                <motion.div 
                                    initial={{ scale: 0.9, y: 20 }} animate={{ scale: 1, y: 0 }} exit={{ scale: 0.9, y: 20 }}
                                    className="relative bg-white w-full max-w-sm rounded-[40px] p-10 shadow-2xl border border-gray-100"
                                >
                                    <div className="w-20 h-20 bg-black text-white rounded-3xl flex items-center justify-center mx-auto mb-8 shadow-xl rotate-[5deg]">
                                        <i data-lucide="user" class="w-10 h-10 fill-white"></i>
                                    </div>
                                    <h3 className="text-3xl font-black text-center mb-2 tracking-tight">Đăng nhập TikTok</h3>
                                    <p className="text-gray-400 text-center font-medium mb-8 text-sm px-6">Vui lòng nhập ID kênh TikTok của bạn để hệ thống nạp xu chính xác.</p>
                                    
                                    <div className="relative mb-6">
                                        <span className="absolute left-5 top-1/2 -translate-y-1/2 text-gray-400 font-bold text-lg">@</span>
                                        <input 
                                            autoFocus
                                            type="text" 
                                            placeholder="username"
                                            className="w-full pl-10 pr-6 py-5 bg-gray-50 rounded-2xl border-2 border-transparent focus:border-[#fe2c55] focus:bg-white transition-all outline-none font-black text-lg"
                                            value={tiktokId}
                                            onChange={(e) => setTiktokId(e.target.value.replace(/[^a-zA-Z0-9._]/g, ''))}
                                            onKeyDown={(e) => e.key === 'Enter' && handleLogin(tiktokId)}
                                        />
                                    </div>
                                    
                                    <button 
                                        onClick={() => handleLogin(tiktokId)}
                                        className="w-full py-5 bg-[#fe2c55] text-white rounded-2xl font-black text-lg shadow-lg"
                                    >
                                        Bắt đầu nạp ngay
                                    </button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* Payment Modal */}
                    <AnimatePresence>
                        {showPayment && (
                            <div className="fixed inset-0 z-[100] flex items-center justify-center p-4">
                                <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} className="absolute inset-0 bg-black/80 backdrop-blur-xl" onClick={() => setShowPayment(false)} />
                                <motion.div initial={{ y: 100, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 100, opacity: 0 }} className="relative bg-white w-full max-w-2xl rounded-[40px] overflow-hidden flex flex-col md:flex-row shadow-2xl h-[90vh] md:h-auto">
                                    {/* Left Side: Info */}
                                    <div className="flex-1 p-8 md:p-12 bg-gray-50">
                                        <div className="mb-10">
                                            <span className="text-[10px] font-black uppercase tracking-widest text-[#fe2c55] bg-pink-50 px-3 py-1 rounded-full border border-pink-100">Giao dịch chờ xử lý</span>
                                            <h3 className="text-3xl font-black tracking-tight mt-4">Thông tin chuyển khoản</h3>
                                        </div>
                                        
                                        <div className="space-y-6">
                                            <div className="bg-white p-6 rounded-3xl border border-gray-100 shadow-sm">
                                                <div className="text-[10px] font-black text-gray-400 uppercase mb-4 tracking-wider flex justify-between">
                                                    <span>Nội dung chuyển khoản</span>
                                                    <span className="text-[#fe2c55]">BẮT BUỘC*</span>
                                                </div>
                                                <div className="flex items-center justify-between gap-4">
                                                    <span className="text-xl md:text-2xl font-black text-[#161823] tracking-tighter">NAP XU {tiktokId} {getFinalCoins()}</span>
                                                    <button 
                                                        onClick={() => { 
                                                            const msg = `NAP XU ${tiktokId} ${getFinalCoins()}`;
                                                            navigator.clipboard.writeText(msg); 
                                                            setCopied(true); 
                                                            setTimeout(() => setCopied(false), 2000); 
                                                        }}
                                                        className="p-3 bg-gray-100 rounded-xl hover:bg-[#fe2c55] hover:text-white transition-all active:scale-90"
                                                    >
                                                        <i data-lucide={copied ? "check" : "copy"} class="w-5 h-5"></i>
                                                    </button>
                                                </div>
                                            </div>

                                            <div className="grid grid-cols-2 gap-4">
                                                <div className="bg-white p-5 rounded-2xl border border-gray-100">
                                                    <div className="text-[10px] font-black text-gray-400 uppercase mb-2">Số lượng</div>
                                                    <div className="text-lg font-black text-[#face15]">{getFinalCoins().toLocaleString()} XU</div>
                                                </div>
                                                <div className="bg-white p-5 rounded-2xl border border-gray-100 text-right">
                                                    <div className="text-[10px] font-black text-gray-400 uppercase mb-2">Số tiền</div>
                                                    <div className="text-lg font-black text-[#fe2c55]">{formatVND(getFinalPrice())}</div>
                                                </div>
                                            </div>
                                        </div>

                                        <div className="mt-12 flex items-center gap-4 p-4 bg-orange-50 text-orange-700 rounded-2xl border border-orange-100">
                                            <div className="w-10 h-10 bg-white rounded-xl flex items-center justify-center flex-shrink-0">
                                                <i data-lucide="alert-triangle" class="w-6 h-6"></i>
                                            </div>
                                            <p className="text-xs font-bold leading-relaxed">Vui lòng <b>KHÔNG</b> thay đổi nội dung chuyển khoản để hệ thống tự động nạp xu ngay.</p>
                                        </div>
                                    </div>

                                    {/* Right Side: QR */}
                                    <div className="w-full md:w-[320px] bg-[#fe2c55] p-8 md:p-12 flex flex-col items-center justify-between">
                                        <div className="text-center text-white">
                                            <div className="bg-white/10 px-4 py-2 rounded-2xl text-[10px] font-black uppercase tracking-widest border border-white/20 inline-block mb-4">Quét QR VietQR</div>
                                            <h4 className="text-lg font-black leading-tight">Mở App Ngân hàng<br/>Để Quét Mã</h4>
                                        </div>

                                        <div className="bg-white p-4 rounded-[40px] shadow-2xl relative">
                                            <div className="absolute inset-0 border-8 border-[#fe2c55] rounded-[40px] pointer-events-none opacity-20"></div>
                                            <img 
                                                src={`https://img.vietqr.io/image/${BANK_CONFIG.bankId}-${BANK_CONFIG.accountNumber}-white.png?amount=${getFinalPrice()}&addInfo=NAP%20XU%20${encodeURIComponent(tiktokId)}%20${getFinalCoins()}&accountName=${encodeURIComponent(BANK_CONFIG.accountName)}`}
                                                className="w-48 h-48 md:w-56 md:h-56 object-contain rounded-2xl"
                                                alt="Payable QR"
                                            />
                                        </div>

                                        <a 
                                            href={BANK_CONFIG.zaloLink}
                                            target="_blank"
                                            className="w-full py-4 bg-white text-[#fe2c55] rounded-2xl font-black text-sm uppercase tracking-widest text-center hover:bg-pink-50 transition-colors shadow-lg"
                                        >
                                            Hỗ trợ Zalo 24/7
                                        </a>
                                    </div>
                                    
                                    <button onClick={() => setShowPayment(false)} className="absolute top-6 right-6 w-10 h-10 bg-gray-200/50 text-white rounded-full flex items-center justify-center hover:bg-gray-200 group transition-all">
                                        <i data-lucide="x" class="w-6 h-6 group-hover:rotate-90 transition-transform"></i>
                                    </button>
                                </motion.div>
                            </div>
                        )}
                    </AnimatePresence>

                    {/* Floating Support */}
                    <motion.a 
                        href={BANK_CONFIG.zaloLink} target="_blank"
                        className="fixed bottom-8 right-8 w-16 h-16 bg-blue-500 text-white rounded-full shadow-2xl flex items-center justify-center z-50 hover:scale-110 active:scale-95 transition-all glow-button"
                        initial={{ scale: 0 }} animate={{ scale: 1 }}
                    >
                        <i data-lucide="message-circle" class="w-8 h-8 fill-white"></i>
                        <span className="absolute right-full mr-4 bg-white text-blue-500 px-4 py-2 rounded-2xl text-xs font-black shadow-xl border border-gray-100 whitespace-nowrap hidden md:block">Chat qua Zalo nàoo!</span>
                    </motion.a>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
